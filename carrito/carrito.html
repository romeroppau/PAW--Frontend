<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAWPrints</title>
</head>
<body>
    <header>
        <h1>PAWPrints</h1>
        <img src="../media/logo.png" alt="logo" width="100" height="100">
        <form role="search">
            <label for="buscar">Buscar libro</label>
            <input type="search" id="buscar" name="buscar">
            <button type="submit">Buscar</button>
        </form>
        <nav>
            <a href="../index.html">Home</a>
            <a href="../formulario/formulario.html">Formulario</a>
            <a href="../catalogo/catalogo.html">catalogo</a>
            <a href="../promociones/promociones.html">Promociones</a>
            <a href="../nosotros/nosotros.html">Nosotros</a>
            <a href="../contacto/contacto.html">Contacto</a>
        </nav>

    </header>

    <main>
        <section aria-labelledby="carrito-heading">
            <h2 id="carrito-heading">Carrito de compras</h2>

            <article>
                <h3>Titulo y Autor</h3>
                <figure>
                    <img src="../media/libros/sutil-arte.jpg" alt="Descripción libro 3" width="150">
                </figure>
                <p>Precio:<data value="0">$0</data></p>
                <form>
                    <label for="cantidad-1">Cantidad</label>
                    <input type="number" id="cantidad-1" name="cantidad-1" value="1" min="1">
                </form>
                <button type="button">Eliminar</button>
            </article>

            <article>
                <h3>Titulo y Autor</h3>
                <figure>
                    <img src="../media/libros/revolucion-abundancia.jpg" alt="Descripción libro 4" width="150">
                </figure>
                <p>Precio:<data value="0">$0</data></p>
                <form>
                    <label for="cantidad-2">Cantidad</label>
                    <input type="number" id="cantidad-2" name="cantidad-2" value="1" min="1">
                </form>
                <button type="button">Eliminar</button>
            </article>
        </section>

        <section aria-labelledby="resumen-heading">
            <h2 id="resumen-heading">Resumen de compra</h2>
            <dl>
                <dt>Subtotal</dt>
                <dd>$0</dd>
                <dt>Envio</dt>
                <dd>$0</dd>
                <dt>total</dt>
                <dd>$0</dd>
            </dl>
            <form>
                <label for="fecha-entrega">Fecha de entrega estimada</label>
                <input type="date" id="fecha-entrega" name="fecha-entrega">
            </form>
            <button type="submit">Finalizar compra</button>
        </section>
    </main>

    <footer>
        <p>© 2026 PAWprints - La 25</p>
    </footer>
</body>
</html>
