<!DOCTYPE html>
<html lang="es">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar sesión</title> 
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="iniciarSesion.css">
</head>

<body>
    <!-- Encabezado visible del sitio -->
    <header>
        <a href="../index.html"><img src="../media/logo.png" alt="PAWprints - Inicio" width="100" height="100"></a>
    </header>
    <!-- Contenido principal -->
    <main>
        <h1>Iniciar sesión</h1>
        <section> 
            <form action="procesar_inicio.php" method="post">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
                <label for="contrasenia">Contraseña</label>
                <input type="password" id="contrasenia" name="contrasenia" autocomplete="current-password" required>
                <button type="submit">Iniciar sesión</button>
            </form>
        </section>
    </main>
    <!-- Pie de página -->
    <footer>
        <p>© 2026 PAWprints - La 25</p>
    </footer>
</body>
</html>
