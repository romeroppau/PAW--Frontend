<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="registrarse.css">
</head>
<body>
    <!-- Encabezado visible del sitio -->
    <header>
        <a href="../index/index.html"><img src="../media/logo.png" alt="PAWprints - Inicio" width="100" height="100"></a>
    </header>
    <!-- Contenido principal -->
    <main>
        <h1>Registrarse</h1>
        <form action="procesar_registro" method="post">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="username" required>
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" autocomplete="tel"> <!-- opcional -->
            <label for="contrasenia">Contraseña</label>
            <input type="password" id="contrasenia" name="contrasenia" autocomplete="new-password" required>
            <label for="confirmar_contrasenia">Confirmar contraseña</label>
            <input type="password" id="confirmar_contrasenia" name="confirmar_contrasenia" autocomplete="new-password" required>
            <button type="submit">Registrarse</button>
        </form>
    </main>
    <!-- Pie de página -->
    <footer>
        <p>© 2026 PAWprints - La 25</p>
    </footer>
</body>
</html>
