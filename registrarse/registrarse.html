<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="registrarse.css">
</head>
<body>
    <!-- Encabezado visible del sitio -->
     <header>
        <a href="index.html"></a>
        <nav class="nav-principal">
            <div class="nav-grupo-izq">
                <a href="index.html">Inicio</a>
                <a href="../catalogo/catalogo.html">Catalogo</a>
                <a href="../promociones/promociones.html">Promociones</a>
                <a href="../nosotros/nosotros.html">Nosotros</a>
                <a href="../contacto/contacto.html">Contacto</a>
            </div>
            <form action="../catalogo/catalogo.html" method="GET" role="search">
                <label for="buscar">Buscar</label>
                <input type="search" id="buscar" name="q" placeholder="Buscar libros..." required>
                <button type="submit">Buscar</button>
            </form>
            <div class="nav-grupo-der">
                <a href="../inicioSesion/iniciarSesion.html">Iniciar sesión</a>
                <a href="../registrarse/registrarse.html">Registrarse</a>
                <a href="../carrito/carrito.html" class="nav-carrito">Carrito 🛒</a>
            </div>
        </nav>
    </header>
    <!-- Contenido principal -->
    <main>
        <h1>Registrarse</h1>
        <form action="procesar_registro" method="post">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="username" required>
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" autocomplete="tel"> <!-- opcional -->
            <label for="contrasenia">Contraseña</label>
            <input type="password" id="contrasenia" name="contrasenia" autocomplete="new-password" required>
            <label for="confirmar_contrasenia">Confirmar contraseña</label>
            <input type="password" id="confirmar_contrasenia" name="confirmar_contrasenia" autocomplete="new-password" required>
            <button type="submit">Registrarse</button>
        </form>
    </main>
    <!-- Pie de página -->
    <footer>
        <p>© 2026 PAWprints - La 25</p>
    </footer>
</body>
</html>
